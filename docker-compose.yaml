version: '3.5'

services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci

  flask:
    restart: always
    build: .
    ports:
      - 5000:5000
    volumes:
      - .:/code/loadlamb
    command: poetry run flask run -h 0.0.0.0
    env_file: .env
    working_dir: /code/loadlamb/loadlamb/chalicelib/tests/wsgi/flaskr/

  loadlamb:
    restart: always
    build: .
    expose:
      - "7001"
    ports:
      - 7001:7000
    volumes:
      - .:/code/loadlamb
    env_file: .env
    working_dir: /code/loadlamb/loadlamb/
    command: poetry run chalice local --host 0.0.0.0 --port 7000

  unittest:
    restart: always
    links:
      - floci:floci
      - django:django
      - flask:flask
    depends_on:
      - floci
      - django
      - flask
    build: .
    volumes:
      - .:/code/loadlamb
    env_file: .env
    environment:
      - DYNAMODB_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    command: poetry run pytest loadlamb/chalicelib/tests/ -v
    working_dir: /code/loadlamb

  django:
    restart: always
    build: .
    ports:
      - 8001:8001
    volumes:
      - .:/code/loadlamb
    command: poetry run python manage.py runserver 0.0.0.0:8001
    env_file: .env
    working_dir: /code/loadlamb/loadlamb/chalicelib/tests/wsgi/djangor/
